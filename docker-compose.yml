version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deskops-postgres
    restart: always
    environment:
      POSTGRES_USER: deskops
      POSTGRES_PASSWORD: deskops_secret
      POSTGRES_DB: deskops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskops -d deskops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deskops-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: deskops-api
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://deskops:deskops_secret@postgres:5432/deskops_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: deskops-production-jwt-secret-replace-me-32-chars
      JWT_REFRESH_SECRET: deskops-production-refresh-secret-replace-me
      FRONTEND_URL: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: deskops-web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
